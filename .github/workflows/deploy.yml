name: Deploy to GitHub Pages

on:
  push:
    branches: [ lp-v1 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project for CI
        run: |
          # Build the project without modifying root index.html
          npx vite build
          # Run only the CI-safe parts of post-build
          node -e "
            import fs from 'fs';
            import path from 'path';
            console.log('🔧 Running CI-safe post-build tasks...');
            
            // Create 404.html for SPA routing
            if (fs.existsSync('public/404.html')) {
              fs.copyFileSync('public/404.html', 'dist/404.html');
            } else {
              fs.copyFileSync('dist/index.html', 'dist/404.html');
            }
            
            // Copy pricing data
            const pricingDir = 'dist/content/pricing';
            fs.mkdirSync(pricingDir, { recursive: true });
            fs.copyFileSync('content/pricing/services.json', path.join(pricingDir, 'services.json'));
            
            console.log('✅ CI-safe post-build completed');
          "
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
